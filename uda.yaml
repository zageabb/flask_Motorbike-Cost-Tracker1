schema_version: 1
application:
  name: motorbike-cost-tracker
  display_name: Motorbike Cost Tracker
  group: Personal
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt", "gunicorn"]
service:
  type: systemd
  entrypoint: ["gunicorn", "--workers", "1", "--timeout", "180", "--bind", "0.0.0.0:5067", "app:app"]
  port: 5067
  health_path: /auth/login
proxy:
  enabled: true
  path: /apps/motorbike-cost-tracker/
  authentication: uda
environment:
  required:
    - UDA_AUTH_ENABLED
    - UDA_REQUIRED_GROUP
    - UDA_TRUSTED_PROXY_IPS
    - UDA_USER_ALIASES
deployment:
  auto_update: false
  rollback: true
  github_reporting: false

