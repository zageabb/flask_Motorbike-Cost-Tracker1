# V2 review candidate; no activation authority
schema_version: 2
application:
  name: motorbike-cost-tracker
  kind: web
  display_name: "Motorbike Cost Tracker"
  group: "Personal"
source:
  branch: main
  repository: "zageabb/flask_Motorbike-Cost-Tracker1"
builds:
  - name: build
    toolchain: python
    working_dir: "."
    commands:
      - ["python","-m","pip","install","-r","requirements.txt","gunicorn"]
services:
  - name: web
    role: web
    runtime: python
    runtime_version: "3.10.12"
    working_dir: "."
    entrypoint: ["gunicorn","--workers","1","--timeout","180","--bind","0.0.0.0:5067","app:app"]
    port: 5067
    health:
      type: http
      path: "/auth/login"
    restart: on-failure
    required_builds: [build]
proxy:
  enabled: true
  upstream: web
  canonical_path: /apps/motorbike-cost-tracker/
  authentication: uda
environment:
  required: ["UDA_AUTH_ENABLED","UDA_REQUIRED_GROUP","UDA_TRUSTED_PROXY_IPS","UDA_USER_ALIASES"]
deployment:
  strategy: systemd
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
